name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR and provide STRUCTURED, CONCISE feedback using the format below.

            **TARGET: 300 lines, MAX: 400 lines**

            Use this EXACT format:

            ## PR Review: [Title] (#[number])
            **Status**: ✅ Approve | ⚠️ Approve with Changes | ❌ Request Changes
            **Summary**: [2-3 sentences overall assessment]
            **Issues**: [X] Critical | [X] High | [X] Medium | [X] Low

            ---

            ## 🚨 Critical Issues (Must fix before merge)
            For each: Problem + Why it matters (1-2 sentences) + Fix + Reference

            ## ⚠️ High Priority (Should fix before merge)
            For each: Problem + Why it matters (1-2 sentences) + Fix + Reference

            ## 💡 Medium Priority (Address in follow-up)
            For each: Problem + Why it matters (brief) + Fix

            ## 📝 Low Priority (Nice to have)
            Brief bullets with context

            ## ✅ Strengths
            4-5 concise bullets highlighting what's done well

            ## 🔒 Security & Performance Notes
            Brief combined section (only if relevant findings)

            ## 📋 Required Actions
            **Before merge**: [checklist]
            **Follow-up**: [checklist]
            **Testing**: [brief checklist]

            GUIDELINES:
            - Keep explanations concise but provide context where it adds value
            - Use brief inline examples when they clarify the fix (avoid large code blocks)
            - Focus on actionable feedback with file:line references
            - Reference spec/docs instead of explaining known concepts
            - Group related issues to save space
            - TARGET 300 lines, allow up to 400 if necessary for clarity

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

