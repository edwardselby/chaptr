name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            IMPORTANT: Before reviewing, check for previous review comments on this PR.

            1. Use `gh pr view ${{ github.event.pull_request.number }} --json comments` to read existing comments
            2. Look for previous reviews from yourself (author: "claude" or "github-actions")
            3. If previous reviews exist:
               - Acknowledge what was already suggested
               - Note what has been fixed since last review
               - Only flag issues that are NEW or still UNRESOLVED
               - Build on previous feedback, don't contradict it
            4. If this is the first review, proceed with full review

            Review this PR and provide STRUCTURED, CONCISE feedback using the format below.

            **TARGET: 100-150 lines, MAX: 200 lines**

            CRITICAL SECTION RULES:
            - OMIT any priority section (Critical/High/Medium/Low) with zero issues
            - OMIT Security & Performance section if no findings
            - DO NOT include filler text like "None identified" or "Great job"
            - Empty sections waste space - only include sections with actual content

            Use this EXACT format:

            ## PR Review: [Title] (#[number])
            **Status**: ✅ Approve | ⚠️ Changes Needed | ❌ Blocked
            **Summary**: [1 sentence max - what is this PR doing?]
            **Issues**: [X] High | [X] Medium | [X] Low
            **Previous Review**: First | Follow-up

            ---

            [OMIT sections below if zero issues]

            ## ⚠️ High Priority (must fix)
            **1. Issue title** - Problem description (file:line) - Fix in one line

            ## 💡 Medium Priority (should fix)
            **1. Issue title** - Problem (file:line) - Fix

            ## 📝 Low Priority (nice to have)
            - Bullet point format for minor suggestions

            ## ✅ Strengths (3-4 bullets max)
            - What's done well

            ## 🔒 Security/Performance (only if findings exist)
            - Brief bullets only

            BREVITY GUIDELINES (ruthlessly concise):
            - Every word must add value - no filler text
            - File references: `path/file.py:line` format only
            - Code examples: ONLY when fix is unclear from description
            - One line per issue when possible: Problem → Fix
            - "Why it matters": MAX 10-15 words, omit if obvious
            - No congratulations, "great job", "none identified" text
            - Omit spec references unless non-obvious
            - CHECK previous review comments first to avoid contradictions
            - Acknowledge fixes made since last review
            - Only flag NEW or UNRESOLVED issues, not already-addressed ones
            - TARGET 100-150 lines total, MAX 200 lines

            EXAMPLE - TOO VERBOSE (❌):
            ## ⚠️ High Priority
            ### 1. Deprecated datetime.utcnow() Usage Risk
            **Issue**: Uses datetime.now() throughout but comments reference utcnow()
            **Why it matters**: datetime.utcnow() is deprecated in Python 3.12+ and will be removed. While current code uses datetime.now(), the comment suggests this was a recent change and indicates potential timezone handling confusion. CHAPTR spec doesn't define timezone requirements, but consistency is critical for sync protocol and conflict resolution.
            **Fix**: Decide on timezone strategy: naive local time OR timezone-aware UTC. If UTC (recommended), use datetime.now(timezone.utc) everywhere. Document in spec.
            **Reference**: See spec "Sync Protocol"

            EXAMPLE - CONCISE (✅):
            ## ⚠️ High Priority
            **1. Timezone-naive timestamps** - `populate_test_data.py:119` breaks sync conflict detection - Use `datetime.now(timezone.utc)`

            CRITICAL: Write the COMPLETE review (all sections above) as ONE SINGLE comment.
            Use `gh pr comment` with your Bash tool to post the ENTIRE review as a SINGLE comment.
            DO NOT post multiple comments - combine everything into one comment body.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

