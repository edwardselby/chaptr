[project]
name = "chaptr"
version = "0.1.0"
description = "Spending projection tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "bcrypt>=4.0.0,<5.0.0",
    "fastapi>=0.104.0",
    "motor>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pymongo>=4.6.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "uvicorn[standard]>=0.24.0",
]

[dependency-groups]
dev = [
    "black>=23.11.0",
    "faker>=20.1.0",
    "httpx>=0.25.0",
    "mongomock>=4.1.2",
    "mongomock-motor>=0.0.34",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.6",
]